<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Basecamp — Plan</title>
  <link rel="stylesheet" href="/styles.css">
  <!-- favicons & PWA -->
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#0d1117">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Basecamp">
</head>
<body>
  <header>
    <h1>Basecamp</h1>
    <nav class="nav">
      <a href="/">Dashboard</a>
      <a href="/habits.html">Habits</a>
      <a href="/workouts.html">Workouts</a>
      <a href="/meals.html" class="active" aria-current="page">Meals</a>
      <a href="/stats.html">Stats</a>
      <a href="/settings.html">Settings</a>
    </nav>
    <button id="logout-btn" class="ghost">Log out</button>
  </header>

  <main>
    <nav class="subnav">
      <a href="/meals.html" class="active" aria-current="page">Plan</a>
      <a href="/foods.html">Foods</a>
    </nav>

    <section class="card">
      <div class="date-nav">
        <button id="prev-day" class="ghost" aria-label="Previous day">‹</button>
        <div class="date-center">
          <span id="date-display" class="date-display"></span>
          <button id="today-btn" class="ghost" hidden>Today</button>
        </div>
        <button id="next-day" class="ghost" aria-label="Next day">›</button>
      </div>
    </section>

    <section class="card">
      <h2 class="totals-head">Totals<span id="logged-badge" class="logged-badge" hidden> · Logged ✓</span></h2>
      <div id="rollup"></div>
      <p class="hint">Planned totals vs your targets. Set targets in Settings; log the day from the Dashboard.</p>
    </section>

    <div id="buckets"></div>
  </main>

  <script type="module" src="/meals.js"></script>
</body>
</html>
